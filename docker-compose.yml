# Local preview: `docker compose up -d`, then open http://localhost:4000.
# Saving a file rebuilds the site and refreshes the browser automatically.
services:
  eleventy:
    image: node:22-slim
    working_dir: /srv/site
    command: sh -c "npm ci && npx @11ty/eleventy --serve --port=4000"
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/site
      - node_modules:/srv/site/node_modules
    environment:
      # File change events don't cross Windows/macOS bind mounts reliably.
      - ELEVENTY_POLL=1

volumes:
  node_modules:

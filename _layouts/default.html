<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if title %}{{ title }} | {% endif %}{{ site.title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' }}">
  {% include "seo.html" %}
</head>
<body{% if body_class %} class="{{ body_class }}"{% endif %}>
  {% if body_class == "cold-storage" %}
    {% include "cold-header.html" %}
    <main class="gc-main">
      {{ content }}
    </main>
    {% include "cold-footer.html" %}
  {% else %}
    {% include "header.html" %}
    <main class="container">
      {{ content }}
    </main>
    {% include "footer.html" %}
  {% endif %}
</body>
</html>
